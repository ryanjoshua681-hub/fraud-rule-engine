spring:
  # Overrides application-test.yml which points kafka to ${spring.embedded.kafka.brokers}
  # (an embedded-broker property that does not exist in this profile).
  # @DynamicPropertySource in the integration test replaces this with the real container address.
  kafka:
    bootstrap-servers: localhost:9092
  # @ServiceConnection on the PostgreSQLContainer overrides these at runtime.
  # Concrete values here prevent Spring from resolving the H2 URL from application-test.yml.
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud_integration_test
    driver-class-name: org.postgresql.Driver
    username: test
    password: test
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
  # @ServiceConnection on the Redis GenericContainer overrides these at runtime.
  data:
    redis:
      host: localhost
      port: 6379

app:
  kafka:
    outgoing:
      topics:
        raw-transactions: it-transactions.raw
        fraud-flags: it-fraud.flags
        dlq: it-transactions.dlq
  rules:
    high-value-threshold: 50000
    velocity-window-seconds: 60
    velocity-max-transactions: 5
    unusual-hours-start: 23
    unusual-hours-end: 5
    round-amount-threshold: 10000
    blacklisted-merchants:
      - BLOCKED_MERCHANT_001

logging:
  level:
    root: WARN
    com.ryanm.fraudruleengine: INFO
