spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092  # no broker needed: Kafka clients connect lazily, so context loads without one
  data:
    redis:
      host: localhost
      port: 6370  # non-standard port — Testcontainers overrides this at runtime

infrastructure:
  environment: test

app:
  kafka:
    outgoing:
      topics:
        raw-transactions: test-transactions.raw
        fraud-flags: test-fraud.flags
        dlq: test-transactions.dlq
  rules:
    high-value-threshold: 50000
    velocity-window-seconds: 60
    velocity-max-transactions: 5
    unusual-hours-start: 23
    unusual-hours-end: 5
    round-amount-threshold: 10000
    blacklisted-merchants:
      - BLOCKED_MERCHANT_001

logging:
  level:
    root: WARN
    com.ryanm.fraudruleengine: INFO
